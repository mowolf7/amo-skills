name: Live demo

# Publishes the EMF-1 example as a website on GitHub Pages:
# https://mowolf7.github.io/amo-skills/
on:
  push:
    branches: [main]
    paths:
      - "examples/emf1/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/emf1

      - id: deployment
        uses: actions/deploy-pages@v5
